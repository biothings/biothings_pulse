# Default registry of BioThings Hub repositories whose data plugins BioThings
# Pulse monitors. Add entries here (or override via the PULSE_REGISTRY_FILE
# setting) to support additional hubs or a plugins-only repo.
#
# Per-repo fields:
#   name               unique short name, used as the {repo} path segment in the API
#   git_url            clone URL (https)
#   ref                branch/tag/commit to check out (null = the remote default branch)
#   enabled            set false to keep an entry but skip it
#   manifest_globs     glob(s), relative to the repo root, matching manifest.json files
#   advanced_globs     glob(s), relative to the repo root, matching each advanced
#                      plugin's source directory
#   requirements       extra pip packages this repo's plugins need at check time
#                      (pre-installed by scripts/install_plugin_requires.py)
#   requirements_files repo-relative requirements file(s) to pre-install instead of
#                      (or in addition to) an inline list, e.g. ["requirements_hub.txt"]
#   sys_path           repo-relative dirs added to sys.path while checking (escape
#                      hatch for non-standard layouts; src/ and hub/ are automatic)
#
# Globs default (when omitted) to the conventional BioThings layout below.

defaults:
  manifest_globs:
    - "plugins/*/manifest.json"
    # Some repos (e.g. mygeneset.info) keep plugins under src/plugins/
    - "src/plugins/*/manifest.json"
  advanced_globs:
    - "**/hub/dataload/sources/*"
    # Some repos (e.g. pending.api) keep advanced plugins directly under plugins/
    - "plugins/*"
    - "src/plugins/*"

repos:
  - name: mygene.info
    git_url: https://github.com/biothings/mygene.info.git
    ref: null
    requirements: [lxml, pandas, biopython]   # bs4 parsing (umls); refseq imports Bio
  - name: myvariant.info
    git_url: https://github.com/biothings/myvariant.info.git
    ref: null
    requirements: [bitarray]       # civic
  - name: mychem.info
    git_url: https://github.com/biothings/mychem.info.git
    ref: null
    requirements: [lxml, pandas]   # umls/cohd/drugbank/unii (bs4), sider (pandas)
  - name: mydisease.info
    git_url: https://github.com/biothings/mydisease.info.git
    ref: null
    requirements: [lxml]           # umls
  - name: biothings.species
    git_url: https://github.com/biothings/biothings.species.git
    ref: null
  - name: mygeneset.info
    git_url: https://github.com/biothings/mygeneset.info.git
    ref: null
    requirements: [lxml]           # msigdb, ctd (bs4 parsing)
  - name: pending.api
    git_url: https://github.com/biothings/pending.api.git
    ref: null
    # Many pending.api plugins are git submodules under plugins/. Only init
    # those (skip the large top-level hub mirrors: mygene/myvariant/mychem).
    submodules:
      - plugins
  - name: NAR.API
    git_url: https://github.com/biothings/NAR.API.git
    ref: null
  - name: DogPark
    git_url: https://github.com/NCATSTranslator/DogPark-Ranger.git
    # Plugin-level deps (e.g. jsonlines) are declared in each manifest's "requires".
