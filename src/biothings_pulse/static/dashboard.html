<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>BioThings Pulse</title>
<script>/* apply saved theme before paint to avoid a flash */
  try { var _t = localStorage.getItem('pulse-theme'); if (_t && _t !== 'auto') document.documentElement.setAttribute('data-theme', _t); } catch (e) {}
</script>
<style>
  :root {
    color-scheme: dark light;     /* adapt native controls (scrollbars, inputs) */
    /* Dark theme (default) */
    --bg: #0a0c10; --surface: #0f131a; --surface-2: #12161f; --hover: #151b25;
    --line: #1e2530; --line-2: #2a323d;
    --ink: #e6edf3; --dim: #9aa4b2; --faint: #6a7480;
    --accent: #4dd0b1;            /* pulse / links */
    --ok: #3fb950; --update: #e3b341; --err: #f85149; --unsup: #6a7480;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  }
  /* Light theme — explicit via the toggle (data-theme="light"). */
  :root[data-theme="light"] {
    --bg: #f6f8fa; --surface: #ffffff; --surface-2: #f2f5f8; --hover: #f4f6f9;
    --line: #e3e8ee; --line-2: #d5dbe2;
    --ink: #1f2328; --dim: #57606a; --faint: #8b95a1;
    --accent: #17957c;
    --ok: #1a7f37; --update: #9a6700; --err: #cf222e; --unsup: #8b95a1;
  }
  /* Auto mode (no explicit choice): follow the OS/browser preference. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      --bg: #f6f8fa; --surface: #ffffff; --surface-2: #f2f5f8; --hover: #f4f6f9;
      --line: #e3e8ee; --line-2: #d5dbe2;
      --ink: #1f2328; --dim: #57606a; --faint: #8b95a1;
      --accent: #17957c;
      --ok: #1a7f37; --update: #9a6700; --err: #cf222e; --unsup: #8b95a1;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13.5px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 14px; padding: 16px 26px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--surface-2), var(--bg));
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .pulse-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 rgba(77,208,177,.6); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(77,208,177,.5)} 70%{box-shadow:0 0 0 9px rgba(77,208,177,0)} 100%{box-shadow:0 0 0 0 rgba(77,208,177,0)} }
  .brand h1 { margin: 0; font-family: var(--mono); font-size: 15px; font-weight: 600; letter-spacing: .5px; }
  .brand h1 b { color: var(--accent); font-weight: 600; }
  .brand .tag { color: var(--faint); font-family: var(--mono); font-size: 11px; letter-spacing: .3px; }
  .nav { display: flex; align-items: center; gap: 20px; font-size: 13px; }
  .nav a { color: var(--dim); }
  .nav a:hover { color: var(--ink); text-decoration: none; }
  .theme-toggle { display: inline-flex; border: 1px solid var(--line-2); border-radius: 3px; overflow: hidden; }
  .theme-toggle button { border: 0; border-radius: 0; background: transparent; color: var(--faint);
    font-family: var(--mono); font-size: 11px; letter-spacing: .3px; padding: 5px 9px; cursor: pointer; }
  .theme-toggle button + button { border-left: 1px solid var(--line-2); }
  .theme-toggle button:hover { color: var(--ink); background: var(--hover); }
  .theme-toggle button.active { color: var(--accent); background: var(--surface-2); }

  main { max-width: 1320px; margin: 0 auto; padding: 24px 26px 40px; }

  .stats { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line);
    border-radius: 3px; background: var(--surface); overflow: hidden; margin-bottom: 26px; }
  .stat { flex: 1 1 0; min-width: 120px; padding: 16px 20px; border-right: 1px solid var(--line); }
  .stat:last-child { border-right: none; }
  .stat .n { font: 600 26px/1 var(--mono); letter-spacing: -.5px; }
  .stat .l { color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .9px; margin-top: 7px; }
  .stat.u .n { color: var(--update); } .stat.e .n { color: var(--err); } .stat.k .n { color: var(--ok); }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  input[type=search] {
    flex: 1 1 260px; min-width: 200px; padding: 9px 12px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line-2); border-radius: 3px; font-size: 13.5px;
  }
  input[type=search]::placeholder { color: var(--faint); }
  input[type=search]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(77,208,177,.12); }
  .chk { color: var(--dim); display: flex; align-items: center; gap: 7px; user-select: none; cursor: pointer; font-size: 13px; }
  .chk input { accent-color: var(--accent); }
  button {
    font: 600 12.5px/1 inherit; cursor: pointer; color: var(--dim);
    background: var(--surface); border: 1px solid var(--line-2); padding: 9px 13px; border-radius: 3px;
    transition: border-color .12s, color .12s;
  }
  button:hover { color: var(--ink); border-color: var(--faint); }
  button.primary { color: var(--accent); border-color: rgba(77,208,177,.4); }
  button.primary:hover { background: rgba(77,208,177,.08); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }

  .table-wrap { border: 1px solid var(--line); border-radius: 3px; overflow-x: auto; background: var(--surface); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: var(--surface-2); color: var(--faint); font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .9px; position: sticky; top: 0; z-index: 1; }
  tbody tr { transition: background .1s; }
  tbody tr:hover { background: var(--hover); }
  tr:last-child td { border-bottom: none; }
  td.src { font-weight: 500; }
  td.src a.src-link { color: var(--ink); }
  td.src a.src-link:hover { color: var(--accent); text-decoration: none; }
  td.src a.src-link:hover .repo { color: var(--accent); }
  td.src .repo { color: var(--faint); font-weight: 400; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .faint { color: var(--faint); }
  /* Cap the Current/Latest version columns; full value shown on hover. */
  .vtrunc { display: inline-block; max-width: 100px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; cursor: help; }

  .type { font-family: var(--mono); font-size: 11px; color: var(--dim);
    border: 1px solid var(--line-2); border-radius: 3px; padding: 1px 7px; }
  .st { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .d-ok { background: var(--ok); }
  .d-error { background: var(--err); }
  .d-unsupported { background: var(--unsup); }
  .d-pending { background: var(--faint); }
  .upd { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .6px;
    color: var(--update); border: 1px solid rgba(227,179,65,.35); background: rgba(227,179,65,.08);
    border-radius: 3px; padding: 1px 7px; }
  tr.has-update td.src { box-shadow: inset 2px 0 0 var(--update); }
  .err-msg { color: var(--err); font-size: 11px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acts { display: flex; gap: 12px; align-items: center; }
  .lnk { color: var(--dim); font-size: 12px; cursor: pointer; background: none; border: none; padding: 0; }
  .lnk:hover { color: var(--accent); text-decoration: underline; }
  .empty { padding: 44px; text-align: center; color: var(--faint); }

  footer { color: var(--faint); font-family: var(--mono); font-size: 11.5px; text-align: center; padding: 20px; }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--line-2);
    border-top-color: var(--accent); border-radius: 50%; animation: rot .7s linear infinite; vertical-align: -1px; }
  @keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="pulse-dot" title="live"></span>
    <div>
      <h1>biothings<b>·</b>pulse</h1>
      <span class="tag">$ biothings-pulse --watch</span>
    </div>
  </div>
  <nav class="nav">
    <div class="theme-toggle" id="theme-toggle" role="group" aria-label="Theme">
      <button type="button" data-theme-set="auto">auto</button>
      <button type="button" data-theme-set="light">light</button>
      <button type="button" data-theme-set="dark">dark</button>
    </div>
    <a href="/docs">API Docs &rarr;</a>
  </nav>
</header>

<main>
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input type="search" id="filter" placeholder="filter by repo or plugin…" autocomplete="off" spellcheck="false" />
    <label class="chk"><input type="checkbox" id="only-updates" /> only updates</label>
    <button id="btn-refresh" title="Reload cached statuses">Refresh</button>
    <button id="btn-recheck-all" class="primary" title="Force a fresh check of every source">Re-check all</button>
    <button id="btn-sync" title="Re-pull repos and rediscover plugins">Sync repos</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Source</th><th>Type</th><th>Status</th><th>Update</th>
          <th>Current</th><th>Latest</th><th>URLs</th><th>Checked</th><th></th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="9" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
</main>

<footer id="footer"></footer>

<script>
const $ = (s) => document.querySelector(s);
let DATA = [];

function timeAgo(iso) {
  if (!iso) return '<span class="faint">never</span>';
  const t = new Date(iso), s = (Date.now() - t.getTime()) / 1000;
  if (isNaN(s)) return '<span class="faint">—</span>';
  for (const [sec, l] of [[86400,'d'],[3600,'h'],[60,'m']]) if (s >= sec) return Math.floor(s/sec) + l + ' ago';
  return Math.max(0, Math.floor(s)) + 's ago';
}
function esc(x) { return (x==null?'':String(x)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ver(v) { return v ? `<span class="mono vtrunc" title="${esc(v)}">${esc(v)}</span>` : '<span class="faint">—</span>'; }

async function api(path, method='GET') {
  const r = await fetch(path, { method });
  if (!r.ok) throw new Error(path + ' → ' + r.status);
  return r.json();
}

function renderStats() {
  const c = (f) => DATA.filter(f).length;
  const stats = [
    ['',  DATA.length, 'sources'],
    ['u', c(d => d.has_update), 'updates'],
    ['k', c(d => d.status === 'ok'), 'ok'],
    ['e', c(d => d.status === 'error'), 'errors'],
    ['',  c(d => d.status === 'unsupported'), 'unsupported'],
  ];
  $('#stats').innerHTML = stats.map(([c,n,l]) =>
    `<div class="stat ${c}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
}

function renderRows() {
  const q = $('#filter').value.trim().toLowerCase();
  const onlyUp = $('#only-updates').checked;
  let rows = DATA.filter(d =>
    (!onlyUp || d.has_update) && (!q || (d.repo+'/'+d.plugin).toLowerCase().includes(q)));
  const rank = d => d.has_update ? 0 : d.status === 'error' ? 1 : d.status === 'unsupported' ? 3 : 2;
  rows.sort((a,b) => rank(a)-rank(b) || (a.repo+a.plugin).localeCompare(b.repo+b.plugin));

  if (!rows.length) {
    $('#rows').innerHTML = `<tr><td colspan="9" class="empty">`
      + (DATA.length ? 'No sources match the filter.' : 'No sources discovered yet — click <b>Sync repos</b>.')
      + `</td></tr>`;
    return;
  }
  $('#rows').innerHTML = rows.map(d => {
    const urls = d.download_urls || [];
    const urlCell = urls.length
      ? `<span class="mono" title="${esc(urls.join('\n'))}" style="cursor:help">${urls.length}</span>`
      : '<span class="faint">0</span>';
    const errCell = d.error ? `<div class="err-msg" title="${esc(d.error)}">${esc(d.error)}</div>` : '';
    const jsonUrl = `/sources/${encodeURIComponent(d.repo)}/${encodeURIComponent(d.plugin)}`;
    return `<tr class="${d.has_update?'has-update':''}">
      <td class="src"><a class="src-link" href="${jsonUrl}" target="_blank" rel="noopener" title="View this source's JSON"><span class="repo">${esc(d.repo)}/</span>${esc(d.plugin)}</a></td>
      <td><span class="type">${esc(d.plugin_type)}</span></td>
      <td><span class="st"><span class="dot d-${esc(d.status)}"></span>${esc(d.status)}</span>${errCell}</td>
      <td>${d.has_update ? '<span class="upd">UPDATE</span>' : '<span class="faint">—</span>'}</td>
      <td>${ver(d.current_version)}</td>
      <td>${ver(d.latest_version)}</td>
      <td>${urlCell}</td>
      <td class="faint mono">${timeAgo(d.checked_at)}</td>
      <td><div class="acts">
        ${d.has_update ? `<button class="lnk" data-act="ack" data-repo="${esc(d.repo)}" data-plugin="${esc(d.plugin)}">ack</button>` : ''}
      </div></td>
    </tr>`;
  }).join('');
}

function render() { renderStats(); renderRows(); }

async function load() {
  try {
    const [sources, health] = await Promise.all([api('/sources'), api('/health').catch(()=>null)]);
    DATA = sources.sources || [];
    render();
    const hv = health ? ` · v${health.version} · catalog ${health.catalog_size}` : '';
    $('#footer').innerHTML = `updated ${new Date().toLocaleTimeString()}${hv} · <a href="/docs">API documentation</a>`;
  } catch (e) {
    $('#rows').innerHTML = `<tr><td colspan="9" class="empty">Failed to load: ${esc(e.message)}</td></tr>`;
  }
}

async function withBusy(btn, fn) {
  const html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try { await fn(); } catch (e) { alert(e.message); }
  finally { btn.disabled = false; btn.innerHTML = html; }
}

$('#filter').addEventListener('input', renderRows);
$('#only-updates').addEventListener('change', renderRows);
$('#btn-refresh').addEventListener('click', (e) => withBusy(e.currentTarget, load));
$('#btn-recheck-all').addEventListener('click', (e) => withBusy(e.currentTarget, async () => { await api('/admin/refresh','POST'); await load(); }));
$('#btn-sync').addEventListener('click', (e) => withBusy(e.currentTarget, async () => { await api('/admin/sync','POST'); await load(); }));

$('#rows').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const { act, repo, plugin } = btn.dataset;
  withBusy(btn, async () => {
    if (act === 'check') await api(`/sources/${encodeURIComponent(repo)}/${encodeURIComponent(plugin)}/check`, 'POST');
    else if (act === 'ack') await api(`/sources/${encodeURIComponent(repo)}/${encodeURIComponent(plugin)}/acknowledge`, 'POST');
    await load();
  });
});

// --- Theme toggle: auto (follow OS) / light / dark, persisted ---
const THEME_KEY = 'pulse-theme';
function applyTheme(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('#theme-toggle button').forEach(b =>
    b.classList.toggle('active', b.dataset.themeSet === t));
}
$('#theme-toggle').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-theme-set]');
  if (!b) return;
  const t = b.dataset.themeSet;
  try { localStorage.setItem(THEME_KEY, t); } catch (_) {}
  applyTheme(t);
});
let _saved = 'auto';
try { _saved = localStorage.getItem(THEME_KEY) || 'auto'; } catch (_) {}
applyTheme(_saved);

load();
setInterval(load, 30000);  // keep the pulse live
</script>
</body>
</html>
